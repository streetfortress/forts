# The framework's own checks. The estate gate (`fort check --all`, the
# nix eval of every host) runs in an estate's CI against the framework
# it pins; here the CLI is tested on its fixtures and the flake is built.
name: checks

on:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          token: ${{ secrets.CONNECTION_PAT }}

      - name: Vet + test the fort CLI
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; echo "::error::gofmt"; exit 1; }
          go vet ./cmd/... ./internal/...
          go test ./cmd/fort ./internal/...

  nix:
    runs-on: ubuntu-latest
    # The closure of this pin comes from the runner's own cache server, not
    # from cache.nixos.org on every push (forts#75). act_runner starts a
    # fresh job container per run, so nothing in /nix survives a run. What
    # survives is one actions/cache entry that holds a Nix *binary cache*
    # directory — narinfo and nar files, which are ordinary files a tar can
    # carry. The store itself is never in the tar: nix reads the restored
    # directory as a substituter and imports only the paths this run asks
    # for, so no restore has to reproduce /nix/store's ownership or its
    # read-only paths.
    env:
      # priority 10 wins against cache.nixos.org's 40, so a path the cache
      # holds never goes over the WAN. trusted=true accepts the unsigned
      # narinfo that `nix copy` writes when no signing key exists; the
      # entry is private to this repository, and only its own runs write it.
      NIX_CONFIG: |
        extra-substituters = file:///nix-closure-cache?trusted=true&priority=10
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore the closure of this pin
        id: closure
        uses: actions/cache@v4
        with:
          path: /nix-closure-cache
          key: nix-closure-v2-${{ hashFiles('flake.lock') }}
          # A moved pin restores the previous cache and fetches the delta.
          restore-keys: nix-closure-v2-

      - name: The cache directory exists before nix reads it
        # nix refuses a file:// substituter whose directory is absent, and
        # a full miss restores nothing.
        run: mkdir -p /nix-closure-cache

      - name: The module outputs evaluate and the package builds
        run: |
          set -euo pipefail
          nix eval --json .#nixosModules --apply builtins.attrNames
          nix eval --raw .#nixosConfigurations.plain-fort.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.plain-cloud-fort.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.linked-fort.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.admin-fort.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.cloud-fort.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.public-fort.config.system.build.toplevel.drvPath
          nix build --no-link --print-out-paths .#fort

      - name: sshd refuses a password on both of its paths
        # The rendered config, not the option. NixOS defaults
        # KbdInteractiveAuthentication to yes and UsePAM to yes, and PAM
        # reads the same /etc/shadow hash that ops/console.nix installs for
        # `deployer` (forts#78). A regression makes the console password
        # good over the mesh, so CI reads the file sshd gets.
        run: |
          set -euo pipefail
          conf=$(nix build --no-link --print-out-paths \
            '.#nixosConfigurations.plain-fort.config.environment.etc."ssh/sshd_config".source')
          grep -qx 'PasswordAuthentication no' "$conf"
          grep -qx 'KbdInteractiveAuthentication no' "$conf"
          grep -qx 'PermitRootLogin no' "$conf"

      - name: sudo authenticates through the challenge, and the pinned verbs never reach it
        # The rendered files, not the options (forts#115). Two regressions
        # are silent at eval time: pam_unix back in the sudo service makes
        # the console password good for root, and the admin rung's `ALL`
        # line AFTER the pinned rules puts every verb behind the ceremony,
        # because sudo takes the tags of the last line that matches. CI
        # reads what sudo gets on the fixture host that enables the rung.
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          nix eval --raw \
            '.#nixosConfigurations.admin-fort.config.security.pam.services.sudo.text' \
            > "$out/pam-sudo"
          grep '^auth ' "$out/pam-sudo" > "$out/pam-sudo-auth"
          test "$(wc -l < "$out/pam-sudo-auth")" -eq 3
          sed -n 1p "$out/pam-sudo-auth" | grep -q 'requisite .*pam_exec.so seteuid stdout quiet .*/sfi-challenge-issue'
          sed -n 2p "$out/pam-sudo-auth" | grep -q 'sufficient .*pam_exec.so seteuid expose_authtok quiet .*/sfi-challenge-verify'
          sed -n 3p "$out/pam-sudo-auth" | grep -q 'required .*pam_deny.so'
          ! grep -q pam_unix "$out/pam-sudo-auth"
          nix eval --raw \
            '.#nixosConfigurations.admin-fort.config.security.sudo.configFile' \
            > "$out/sudoers"
          grep -n '^deployer ' "$out/sudoers"
          test "$(grep '^deployer ' "$out/sudoers" | head -n1)" = "deployer     ALL=(ALL:ALL)    PASSWD: ALL"
          grep -q '^deployer .*PASSWD: /run/current-system/sw/bin/challenge, NOPASSWD: ' "$out/sudoers"
          grep -qx 'Defaults:deployer timestamp_timeout=15, timestamp_type=tty' "$out/sudoers"
          grep -qx 'Defaults!/run/current-system/sw/bin/challenge timestamp_timeout=0' "$out/sudoers"

      - name: nixos-pull builds main, from the estate's own repo
        # The rendered verb, not the module. `--ref <branch>` was a path
        # from the deployer key to root (forts#76) and the `--from`
        # handler named /sfi/deployments in a literal, so every estate's
        # recovery hatch recovered the first estate (forts#77). Both
        # regress silently: the module still evaluates, and the verb is
        # only ever read on a fort that is already in trouble. The script
        # is an eval away — writeShellApplication keeps the text as a
        # derivation ATTRIBUTE — so CI reads what the fort will run. The
        # fixture estate is sfi/fixture-estate, which is the point: a
        # literal shows up as the wrong repo.
        run: |
          set -euo pipefail
          nix eval --raw \
            .#nixosConfigurations.plain-fort.config.sfi.ops.commands.nixos-pull.script \
            > verb.sh
          grep -q 'ref=main&dir=nixos' verb.sh
          grep -q '/sfi/fixture-estate.git' verb.sh
          # The alias is the fixture's known_hosts line, read from the
          # fixture: the framework names no forge of its own (forts#1).
          alias=$(sed -n 's/^known_hosts = "\(\[[^]]*\]:[0-9]*\) .*/\1/p' tests/estate/estate.toml)
          test -n "$alias"
          grep -qF "HostKeyAlias=$alias" verb.sh
          ! grep -q 'ref=\$ref' verb.sh
          ! grep -q '/sfi/deployments' verb.sh

      - name: The anonymous route clones with no credential, and pins nothing
        # forts#167, read off the public fixture host (tests/public-estate,
        # an https:// repo). Three things regress silently — the module
        # still evaluates with each: a GIT_SSH_COMMAND on the rebuild
        # unit names a deploy key the host's sops file does not carry
        # (activation fails on the host, not in CI); a flux-git-deploy-key
        # declaration does the same; and a `--from` that dials an address
        # over https fails the certificate check at the one moment the
        # verb is wanted. CI reads what the fort gets: the unit's
        # environment, the declared secrets, the bootstrap script and the
        # verb — and, beside them, that the ssh fixture host still carries
        # all three, so the branch is the route's and not a regression.
        run: |
          set -euo pipefail
          env=$(nix eval --json .#nixosConfigurations.public-fort.config.systemd.services.nixos-upgrade.environment --apply builtins.attrNames)
          echo "$env" | grep -qv GIT_SSH_COMMAND
          secrets=$(nix eval --json .#nixosConfigurations.public-fort.config.sops.secrets --apply builtins.attrNames)
          echo "$secrets" | grep -q flux-sops-age-key
          ! echo "$secrets" | grep -q flux-git-deploy-key
          nix eval --raw .#nixosConfigurations.public-fort.config.systemd.services.flux-bootstrap.script > bootstrap.sh
          grep -q 'anonymous route: no git-auth secret' bootstrap.sh
          ! grep -q 'ssh-keygen' bootstrap.sh
          nix eval --raw .#nixosConfigurations.public-fort.config.sfi.ops.commands.nixos-pull.script > verb.sh
          grep -q 'https://github.com/acme/public-estate.git' verb.sh
          grep -q 'fails the certificate check' verb.sh
          ! grep -q 'HostKeyAlias' verb.sh
          test "$(nix eval --raw .#nixosConfigurations.public-fort.config.sfi.estate.authRoute)" = none
          test "$(nix eval --raw .#nixosConfigurations.public-fort.config.sfi.estate.knownHosts)" = ""
          # The ssh fixture host keeps the deploy key, the pin and the hatch.
          nix eval --json .#nixosConfigurations.cloud-fort.config.systemd.services.nixos-upgrade.environment --apply builtins.attrNames | grep -q GIT_SSH_COMMAND
          nix eval --json .#nixosConfigurations.cloud-fort.config.sops.secrets --apply builtins.attrNames | grep -q flux-git-deploy-key
          nix eval --raw .#nixosConfigurations.cloud-fort.config.systemd.services.flux-bootstrap.script | grep -q 'ssh-keygen'
          nix eval --raw .#nixosConfigurations.cloud-fort.config.sfi.ops.commands.nixos-pull.script | grep -q 'HostKeyAlias=github.com'
          test "$(nix eval --raw .#nixosConfigurations.cloud-fort.config.sfi.estate.authRoute)" = ssh

      - name: The core's verbs are the ladder and nothing else
        # forts#151: a verb that exists for one workload, one runbook or
        # one unit is a layer's, declared through sfi.ops.commands in the
        # estate. The set the core declares is read off the fixture hosts,
        # so a module that grows a verb back fails here, by name. The
        # plain fort has no cluster, so admin-unlock (a cluster verb of
        # the admin rung) is absent from it and present on admin-fort
        # only when k3s is — which the fixture does not enable.
        run: |
          set -euo pipefail
          test "$(nix eval --json .#nixosConfigurations.plain-fort.config.sfi.ops.commands --apply builtins.attrNames)" \
            = '["challenge","nixos-pull","nixos-revision","nixos-rollback"]'
          test "$(nix eval --json .#nixosConfigurations.plain-cloud-fort.config.sfi.ops.commands --apply builtins.attrNames)" \
            = '["challenge","nixos-pull","nixos-revision","nixos-rollback"]'
          test "$(nix eval --json .#nixosConfigurations.admin-fort.config.sfi.ops.commands --apply builtins.attrNames)" \
            = '["challenge","nixos-pull","nixos-revision","nixos-rollback"]'
          test "$(nix eval --json .#nixosConfigurations.linked-fort.config.sfi.ops.commands --apply builtins.attrNames)" \
            = '["challenge","nixos-pull","nixos-revision","nixos-rollback"]'
          nix eval --json .#nixosModules --apply builtins.attrNames | grep -qv 'ops-flux\|ops-logs\|ops-workloads\|ops-systemd'

      - name: An estate that fort init created evaluates against this checkout
        run: tests/init-estate.sh

      - name: The github.com fixture estate passes the gate
        # `fort check --all` on tests/github-estate (forts#1): the repo on
        # github.com, no hub, no lab CA — tier one of the two tiers of
        # forge. The nix eval above proves the host composes; this proves
        # the tree passes the gate an estate's own CI runs, and that the
        # gate assumes no lab forge, no .lofi name and no mesh pin.
        run: tests/check-fixture-estate.sh tests/github-estate

      - name: The public fixture estate passes the gate
        # `fort check --all` on tests/public-estate (forts#167): the repo
        # public on github.com, cloned anonymously over https — no deploy
        # key, no host key, no forge token. This proves the gate asks for
        # none of them on this route, and names the route instead.
        run: tests/check-fixture-estate.sh tests/public-estate

      - name: Refill the cache with what this run used
        # An exact hit refills nothing: the bulk is nixpkgs, and nixpkgs
        # moves only when flake.lock moves. A moved lock, or no cache,
        # writes the directory again from the store, so the cache holds
        # this closure and no path of an older one.
        if: steps.closure.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf /nix-closure-cache
          mkdir -p /nix-closure-cache
          # Every eval writes .drv files, and nix substitutes none of them:
          # they were 4526 of the 5428 paths in the first entry, for 9MB of
          # its 625MB. The gain is the file count, not the bytes — the copy,
          # the tar and the restore each handle 902 paths instead of 5428.
          nix path-info --all | grep -v '\.drv$' \
            | xargs nix copy --to "file:///nix-closure-cache?compression=zstd"
          du -sh /nix-closure-cache
