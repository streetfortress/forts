# cert-manager issues per-hostname TLS certs from step-ca via ACME http01
# (solver routes attach to the Gateway — enableGatewayAPI). The step-ca
# ClusterIssuer lives in ../../configs/cluster-issuer.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true

    config:
      enableGatewayAPI: true

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
