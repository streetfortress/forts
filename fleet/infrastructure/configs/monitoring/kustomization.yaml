apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-edge.yaml
  - alertmanager-edge.yaml
  - alertmanager-edge-config.sops.yaml
  - servicemonitors.yaml
  - podmonitors.yaml
  - node-exporter.yaml
  - rules-edge.yaml
  - mesh-services-edge.yaml

# Notification templates for the Alertmanager (templates/discord.tmpl),
# mounted via the Alertmanager CR's spec.configMaps. Fixed name: the CR
# references it by name, and the operator's config-reloader watches the
# mount, so edits hot-reload without a hash-suffixed rollout. Substitution
# is disabled because flux's envsubst would eat the template's `$alerts`.
configMapGenerator:
  - name: alertmanager-templates
    namespace: monitoring
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - templates/discord.tmpl
