# In-cluster DNS for lab names. k3s CoreDNS imports /etc/coredns/custom/
# *.server for additional server blocks. Applied manually once at cluster
# bring-up (flux can't fetch git without it), then owned by the
# infrastructure Kustomization.
#
# .lofi forwards to the lab dnsmasq's MESH listener (soundship,
# 10.1.0.1 — .files homelab/services/caddy/dnsmasq.conf listens on LAN
# and mesh): uniformly reachable from every cluster node, cloud hosts
# included (web3 has no LAN, so the old 10.0.0.2 target was unreachable
# there). The forward egresses via the node's wg0, so dnsmasq's
# localise-queries returns the mesh-subnet answer — a single A record,
# killing the dual-A lottery that shipped zero fluent-bit logs in #119.
#
# gitea.zen.lofi is additionally pinned in a hosts block: flux and chart
# pulls must keep resolving even when the dnsmasq is down. The address is
# PER-CLUSTER (${GITEA_ADDR} from cluster-vars; flux-bootstrap substitutes
# the same token day-0 from its module option): mesh 10.1.0.6 for clusters
# whose tunnel to zenbook exists, LAN 10.0.0.6 for LAN forts — a new
# fort's mesh path to zenbook doesn't exist until zenbook's hand-frozen
# peer set learns it (the 2026-09-12 backup-drill fort spent an hour
# unable to clone through exactly that gap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  zen-lofi.server: |
    zen.lofi:53 {
      errors
      cache 30
      hosts {
        ${GITEA_ADDR} gitea.zen.lofi
        fallthrough
      }
      forward . 10.1.0.1
    }
  lofi.server: |
    lofi:53 {
      errors
      cache 30
      forward . 10.1.0.1
    }
