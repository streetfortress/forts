# Public ACME issuer for production hostnames (lab certs come from step-ca,
# cluster-issuer.yaml — README Key decisions: step-ca in the lab, Let's
# Encrypt in production, #43). Shared layer: lab clusters simply never
# reference it. Same http01 gateway solver shape as step-ca — challenge
# routes attach to the per-cluster Gateway's http listener, which the
# production cloud firewall admits on 80.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # ACME account contact (expiry/deprecation notices). Mutable metadata:
    # switching to a role mailbox (infra@) later is just an edit here.
    email: support@streetfortress.com
    privateKeySecretRef:
      name: letsencrypt-acme-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: homelab
                namespace: traefik
