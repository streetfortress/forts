# HTTPRoute for moment-tally-website, as `fort add` renders it from the chart
# contract's http block (moment-tally-website:3000) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-moment-tally-website.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moment-tally-website
  namespace: moment-tally-website
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https-moment-tally-website
  hostnames:
    - moment-tally-website.lab-fort.lofi
  rules:
    - backendRefs:
        - name: moment-tally-website
          port: 3000
