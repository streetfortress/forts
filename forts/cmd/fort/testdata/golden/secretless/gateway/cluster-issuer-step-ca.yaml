# ACME issuer backed by the lab's step-ca — PER-LAB-CLUSTER, not shared
# infrastructure: step-ca.lofi is a LAN address, so on cloud clusters this
# issuer can never register (ErrRegisterACMEAccount, i/o timeout) and its
# Ready=False wedged web3's infrastructure kustomization health checks for
# hours (2026-09-11). A cluster's issuer set is exactly the CAs it can
# reach. Copies live beside each lab cluster's gateway; luxor's is
# identical. http01 solver routes attach to
# the per-cluster Gateway (fleet/apps/<cluster>/gateway/) via the http
# listener, taking precedence over its https redirect by exact path match.
#
# caBundle is the base64 of step-ca-root.pem (public; kept alongside for
# reference): base64 -w0 step-ca-root.pem
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    server: https://step-ca.lofi:9000/acme/acme/directory
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: homelab
                namespace: traefik
