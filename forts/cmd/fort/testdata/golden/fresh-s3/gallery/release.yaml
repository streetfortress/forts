# gallery — HelmRelease rendered by `fort add` from the chart's contract:
# the `wire:` values paths are filled from the fort's providers by
# convention (postgres → the shared sites-db, tenant `gallery`);
# (s3 → the shared rustfs, bucket and identity `gallery`); password-class
# keys ride the gallery-env Secret. Retry forever: the first install
# races its providers (and a preview pin races the images) — never park
# on a failed release waiting for an ops nudge. Refine in place after
# add: replicas for the node shape, non-secret env as values (never in
# the Secret — a values change rolls pods), app-specific knobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gallery
  namespace: gallery
spec:
  interval: 1h
  releaseName: gallery
  chartRef:
    kind: OCIRepository
    name: gallery
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    database:
      host: sites-db-rw.sites-db.svc.cluster.local
      name: gallery
      port: "5432"
      user: gallery
    existingSecret: gallery-env
    storage:
      accessKey: gallery
      bucket: gallery
      endpoint: http://rustfs-svc.rustfs.svc.cluster.local:9000
