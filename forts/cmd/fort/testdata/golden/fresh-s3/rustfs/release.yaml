# Shared rustfs instance for this fort — the S3 battery an app turns on
# by declaring `requires.s3.<handle>` in its chart contract, the same way
# sites-db and valkey are turned on (docs/infra/providers.md). It is the
# template `fort add` renders on a fort's first s3 need, adapted from
# luxor's own instance (flux/apps/luxor/rustfs/release.yaml). In-cluster
# only: no route, no console hostname, no mesh NodePort — the consumers
# are the workloads beside it, and the restic PV backup of its data
# volume is the content backup (docs/infra/backups.md, "Fort-local
# rustfs"), never a bucket replication.
#
# The instance carries only the root pair (Secret rustfs-credentials),
# which the bucket Job and the IAM CronJob hold and no app ever sees.
# Consumers register an identity each: a bucket line in bucket-job.yaml,
# a policy document under policies/, and a key in users.sops.yaml, which
# iam-cronjob.yaml reconciles into the instance.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 1h
  chart:
    spec:
      chart: rustfs
      version: 0.12.0 # app 1.0.0-beta.12
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    replicaCount: 1
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false

    # Chart expects keys RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY (envFrom).
    # Seeded from forts.contract.yaml beside this file.
    secret:
      existingSecret: rustfs-credentials

    config:
      rustfs:
        address: ":9000"
        console_enable: "true"
        console_address: ":9001"
        # Becomes RUSTFS_OBS_LOGGER_LEVEL (upstream default: error). At
        # info, beta.12 emits a tracing span enter/exit pair per object the
        # scanner touches, to stdout AND the /logs PVC — ~9 GB/h on luxor,
        # and a feedback loop through fluent-bit → Loki (2026-09-14).
        log_level: "warn"
        region: "us-east-1"
        # Metrics via OTLP push into otel-collector.yaml (rustfs has no
        # /metrics endpoint). Traces/logs/profiling stay off: logs keep
        # going to stdout → fluent-bit → Loki; use_stdout stays FALSE
        # because it means "also dump the OTLP signals to stdout" (every
        # metric datapoint as a log line), not "keep logging to stdout".
        obs_endpoint:
          enabled: true
          base_endpoint: http://otel-collector.rustfs.svc.cluster.local:4318
          use_stdout: false
          metrics:
            enabled: true
            endpoint: http://otel-collector.rustfs.svc.cluster.local:4318/v1/metrics
          trace:
            enabled: false
          logs:
            enabled: false
          profiling:
            enabled: false

    # rustfs writes scratch data to /tmp/rustfs_scanner; the chart's default
    # readOnlyRootFilesystem: true breaks the scanner (carried over from
    # luxor — revisit on a beta upgrade).
    containerSecurityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true

    # In-cluster only. An app that must serve objects to browsers puts a
    # route in front of its OWN Service, not in front of the store.
    ingress:
      enabled: false
    gatewayApi:
      enabled: false

    storageclass:
      name: local-path
      # local-path does not enforce the size; the fort's root disk is the
      # real ceiling and its alert the real signal. Refine in place for
      # a content-heavy fort. The data volume (rustfs-data) is what the
      # host's restic PV backup keeps; the log volume is excluded there.
      dataStorageSize: 20Gi
      logStorageSize: 1Gi

    affinity:
      podAntiAffinity:
        enabled: false

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1000m

    # /health goes through the S3 handler and returns AccessDenied for
    # anonymous requests, so the HTTP probes never pass (luxor, zenbook).
    # Disabled — revisit: the chart's readiness probe now targets
    # /health/ready, which may be fixed in beta.
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
