apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  # symbology-env, seeded from forts.contract.yaml (the pre-`fort seed`
  # full form; shrinks to nothing once the CLI reads the chart's own
  # contract). Listed-but-absent = the pre-merge kustomize guard.
  - secrets.sops.yaml
  - route.yaml
  - monitoring.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Local copy of fleet/infrastructure/configs/step-ca-root.pem (kustomize
  # build-root restriction); consumed as certSecretRef by the
  # OCIRepository so source-controller trusts gitea.zen.lofi. Public
  # cert, plain generator — no sops.
  - name: symbology-oci-ca
    namespace: flux-system
    files:
      - ca.crt=step-ca-root.pem
