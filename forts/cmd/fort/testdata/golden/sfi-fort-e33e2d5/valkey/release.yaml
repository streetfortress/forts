# Shared valkey instance for this fort — the cache profile from
# staging-k3s (#182: nothing precious, no persistence, hard memory cap
# with LRU eviction; restart = cold cache), which is the template
# `fort add` renders on a fort's first valkey need. The instance carries
# only the chart-required `default` (admin) user; consumers register an
# ACL user each via a patch file beside this one (acl-<app>.yaml) and a
# key in the valkey-users secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: valkey
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 0.11.0 # app 9.1.1
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    # ACL users; passwords come from the valkey-users secret (key =
    # username). The chart REQUIRES the default user once auth is on —
    # it keeps full access and acts as the admin identity.
    auth:
      enabled: true
      usersExistingSecret: valkey-users
      aclUsers:
        default:
          permissions: "~* &* +@all"

    # Cache-only: everything in RAM, bounded, evicting. maxmemory sits
    # well under the container limit (valkey overhead + COW headroom).
    valkeyConfig: |
      maxmemory 96mb
      maxmemory-policy allkeys-lru
      save ""
      appendonly no

    dataStorage:
      enabled: false

    resources:
      requests:
        memory: 48Mi
        cpu: 25m
      limits:
        memory: 160Mi
        cpu: 250m

    # INFO-level observability: the chart's redis_exporter sidecar,
    # chart-wired to authenticate as the default user from valkey-users.
    # Scraped via the PodMonitor in monitoring.yaml beside this file.
    metrics:
      enabled: true
      exporter:
        resources:
          requests: { memory: 32Mi, cpu: 10m }
          limits: { memory: 64Mi, cpu: 100m }
