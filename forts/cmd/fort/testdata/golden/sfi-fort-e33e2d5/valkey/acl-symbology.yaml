# symbology's ACL user on the shared valkey (everything except admin and
# dangerous commands, with INFO added back: it sits in @dangerous, and
# clients run it as their ready check — without it ioredis logs NOPERM
# and skips the check); its password is the `symbology` key of the
# valkey-users secret, mirrored into symbology-env as CACHE_PASSWORD —
# rotate in lockstep.
- op: add
  path: /spec/values/auth/aclUsers/symbology
  value:
    permissions: "~* &* +@all -@admin -@dangerous +info"
