# sfi-prod-439bf72's edge Gateway, as `fort add` renders it on a fort's
# first http need: the http listener only (ACME http01 challenge routes
# attach here). Each service's https listener arrives as a JSON6902
# patch file beside this one (listener-<app>.yaml) plus its cert-manager
# Certificate, with the HTTPRoute in the app's own dir. Name/namespace
# are uniform across clusters ("homelab", ns traefik) so route manifests
# stay portable.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
