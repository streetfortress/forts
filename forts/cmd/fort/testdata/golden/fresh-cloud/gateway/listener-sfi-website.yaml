# https listener for sfi-website — appended to the Gateway by the patch
# entry in kustomization.yaml. Hostname follows the cloud convention
# <app>.<fort>.example.cloud; the certificate is certificate-sfi-website.yaml.
- op: add
  path: /spec/listeners/-
  value:
    name: https-sfi-website
    port: 8443
    protocol: HTTPS
    hostname: sfi-website.cloud-fort.example.cloud
    tls:
      mode: Terminate
      certificateRefs:
        - name: sfi-website-tls
    allowedRoutes:
      namespaces:
        from: All
