# HTTPRoute for sfi-website, as `fort add` renders it from the chart
# contract's http block (sfi-website-ui:3000) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-sfi-website.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sfi-website
  namespace: sfi-website
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https-sfi-website
  hostnames:
    - sfi-website.sfi-prod-439bf72.streetfortress.cloud
  rules:
    - backendRefs:
        - name: sfi-website-ui
          port: 3000
