# HTTPRoute for gallery, as `fort add` renders it from the chart
# contract's http block (gallery:3000) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-gallery.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gallery
  namespace: gallery
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https-gallery
  hostnames:
    - gallery.lab-fort.lofi
  rules:
    - backendRefs:
        - name: gallery
          port: 3000
