apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # sops-canary.yaml is generated by fort mint during the fort's
  # identity step (encrypted to the cluster's fresh age key);
  # listing it missing keeps `kustomize build` failing until identity
  # exists — the repo's established pre-merge guard.
  - sops-canary.yaml
