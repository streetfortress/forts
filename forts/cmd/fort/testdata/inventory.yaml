# Test fixture inventory: one lab host and one cloud host with the
# fields the fort CLI reads. Fixture-shaped tests use this so they do
# not depend on which forts the real inventory declares today; the
# golden tests that replay against COMMITTED trees keep the real one.
all:
  children:
    nixos:
      hosts:
        lab-fort:
          ansible_host: 10.0.0.99
          wg_vpn_ip: 10.1.0.99
          flux_cluster: true
        cloud-fort:
          provider: linode
          region: us-sea
          instance_type: g6-standard-2
          dns_zone: example.cloud
          dns_name: cloud-fort
          production: true
          flux_cluster: true
          wg_vpn_ip: 10.1.0.98
