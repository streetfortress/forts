# Test fixture contract (see Chart.yaml): postgres + s3 + http.
contract: v1
secret:
  values: existingSecret
  keys:
    SESSION_SECRET: {generate: b64_32}
    DATABASE_PASSWORD: {template: "${postgres.db.password}"}
    # The s3 identity's secret half; the access key is the non-secret
    # twin (wired below), the bucket is the app.
    S3_SECRET_KEY: {template: "${s3.media.secretKey}"}
requires:
  postgres:
    db:
      wire:
        host: database.host
        port: database.port
        name: database.name
        user: database.user
  s3:
    media:
      wire:
        endpoint: storage.endpoint
        bucket: storage.bucket
        accessKey: storage.accessKey
http:
  service: gallery
  port: 3000
