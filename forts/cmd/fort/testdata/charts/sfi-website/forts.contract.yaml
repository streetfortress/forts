# DRAFT contract for sfi-website (test fixture — see Chart.yaml).
contract: v1
secret:
  values: existingSecret
  keys:
    BETTER_AUTH_SECRET: {generate: b64_32}
    # Composed from the postgres outputs: password becomes a var over the
    # tenant's sops file, the rest is inlined by convention.
    DATABASE_URL: {template: "postgresql://${postgres.db.user}:${postgres.db.password}@${postgres.db.host}:${postgres.db.port}/${postgres.db.name}"}
    RESEND_API_KEY: {external: "Resend → API keys (re_)", optional: true}
requires:
  postgres:
    db:
      wire:
        host: ui.env.POSTGRES_HOST
        port: ui.env.POSTGRES_PORT
        name: ui.env.POSTGRES_DB
        user: ui.env.POSTGRES_USER
http:
  service: sfi-website-ui
  port: 3000
