# One shared namespace for the fort's object store: a single rustfs that
# no app owns, so it gets its own namespace and the apps reach it
# cross-namespace via the -svc Service. The forts.sfi/provider label is
# the one every provider namespace a fort renders carries (sites-db,
# valkey, rustfs): `fort check` requires it, and
# `kubectl get ns -l forts.sfi/provider` enumerates the forts-managed set
# before any rename groups them under one prefix (#326 follow-up).
apiVersion: v1
kind: Namespace
metadata:
  name: rustfs
  labels:
    forts.sfi/provider: s3
