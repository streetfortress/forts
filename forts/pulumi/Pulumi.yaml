# Pulumi project (#42/#87): micro-stacks, stack name == the manifest's host.
# The project name is baked into every resource URN — settled as `forts`
# before any real state existed; renaming it later is state surgery.
#
# State is the file:// backend committed in this repo (the owning repo is
# where state lives — dissolves the client-buildout bootstrap problem);
# secrets inside state are encrypted per-value by the passphrase provider
# (passphrase itself sops-managed).
#
#   pulumi login file://$(git rev-parse --show-toplevel)/forts/pulumi/state
#   pulumi stack init web3 --secrets-provider passphrase
#   pulumi preview -s web3 --diff
#
# Apply runs through `fort provision <host>`, which execs `pulumi up`
# with inherited stdio — the stock CLI stays the escape hatch.
name: forts
runtime: go
description: SFI fleet cloud provisioning — instance, firewall, DNS; the mesh and flux own everything else, and the single-use image is fort provision's job.
