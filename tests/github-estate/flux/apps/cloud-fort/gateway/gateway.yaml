# cloud-fort's edge Gateway, as `fort scaffold` renders it on every
# cluster fort: the http listener only (ACME http01 challenge routes
# attach here). Each service's https listener arrives as a JSON6902 patch
# file beside this one (listener-<app>.yaml) plus its cert-manager
# Certificate — `fort add` appends them, with the HTTPRoute in the app's
# own dir, and a layer whose stack serves a hostname appends the same way
# (oss/fort-layers#13). Name/namespace are uniform across clusters
# ("edge", ns traefik) so route manifests stay portable; the estate's
# ClusterIssuer solves its challenges here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
