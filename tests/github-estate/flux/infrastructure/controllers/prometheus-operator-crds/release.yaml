# Prometheus operator CRDs, shipped separately from the operator itself so
# CRD upgrades are explicit and the kube-prometheus-stack release can run
# with crds.enabled=false (#53). The HelmRepository lives in
# ../kube-state-metrics/repository.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 31.0.1 # operator v0.93.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
