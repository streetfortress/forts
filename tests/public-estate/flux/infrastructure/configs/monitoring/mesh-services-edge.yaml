# Mesh exposure for the edge stack, every cluster: the edge Prometheus UI
# and — the real operator need — the edge Alertmanager's API/UI, so
# silences can be set without kubectl port-forward gymnastics (silences
# live per-alertmanager; edge-evaluated alerts can ONLY be silenced
# here). NodePorts per the mesh-services.yaml precedent: on a cluster
# fort 80/443 face the public internet, so the ingress path is the
# wrong place for admin planes — the ports are opened mesh-only in
# modules/k3s-server.nix, which is the actual trust boundary.
# (k3s does enforce NetworkPolicy, but NodePort traffic is SNAT'd under
# externalTrafficPolicy=Cluster, so pod-level source filtering can't
# distinguish mesh from LAN — the host firewall can, and already does
# for a hub's ports on a link.)
#
# Port mnemonics: 9090 → 30909, 9093 → 30993 (NodePort range caps at
# 32767).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-edge-mesh
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: edge
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30909
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-edge-mesh
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: edge
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      nodePort: 30993
