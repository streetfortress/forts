# CloudNativePG operator. Postgres itself is per-service: each service that
# needs a database declares a Cluster/Database CR in its own app dir, using
# the lab image (gitea.zen.lofi/sfi/postgresql — CNPG base + timescaledb;
# built from the action-runner-image repo). Luxor is greenfield, so CNPG is
# the postgres from day one — the bitnami chart is never duplicated here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.0 # operator 1.30.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
