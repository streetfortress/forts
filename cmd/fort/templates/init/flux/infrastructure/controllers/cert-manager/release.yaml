# cert-manager issues per-hostname TLS certs via ACME http01 (solver
# routes attach to the Gateway — enableGatewayAPI). The public issuer
# lives in ../../configs/cluster-issuer-letsencrypt.yaml when the estate
# names an ACME contact; a private CA's issuer is a layer's.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    crds:
      enabled: true

    config:
      enableGatewayAPI: true

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
