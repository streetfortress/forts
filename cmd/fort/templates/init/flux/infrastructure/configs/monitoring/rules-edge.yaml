# Edge rule set (#53): "this cluster is unhealthy", nothing else. These must
# evaluate and page locally with the mesh down. Cross-cluster rules and the
# dead man's switch live ONLY on luxor's ThanosRuler
# (flux/apps/luxor/monitoring/rules-central.yaml) so nothing pages twice.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: edge-cluster-health
  namespace: monitoring
spec:
  groups:
    - name: cluster-health
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }}/{{ $labels.instance }} scrape target down"

        - alert: NodeMemoryPressure
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} has <10% memory available"

        - alert: NodeDiskFillingUp
          expr: >-
            node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"} /
            node_filesystem_size_bytes < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has <15% disk left"

        - alert: KubePodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crashlooping"

        # Init containers restart under a separate KSM metric — the
        # grafana init-chown crashloop (2026-09-10) was invisible to the
        # rule above.
        - alert: KubeInitContainerCrashLooping
          expr: increase(kube_pod_init_container_status_restarts_total[15m]) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} init container {{ $labels.container }} is crashlooping"

        # A pod that never starts restarts nothing, so the two rules above
        # are blind to it: rustfs-bucket-init sat in ImagePullBackOff for
        # 28h (minio/mc left Docker Hub, 2026-09-13) with no alert. KSM's
        # waiting-reason gauge covers the image-pull family — sparse since
        # KSM v2: the series only exists while a container is waiting, so
        # an absent metric is the healthy state, not a broken scrape. The
        # `for` rides out a registry hiccup and a first pull of a big image.
        - alert: KubePodImagePullFailing
          expr: >-
            max by (namespace, pod, container, reason) (
              kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}
            ) == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image ({{ $labels.reason }}, container {{ $labels.container }})"

        # Flux CR status via the #135 KSM customResourceState wiring: a
        # HelmRelease stalled on a rejected manifest, or a Kustomization
        # pinned by a failing health check, sits at ready=False with no
        # pod-level symptom this rule set would otherwise see. Suspended
        # resources are deliberately not-ready; don't page on them.
        - alert: FluxResourceNotReady
          expr: gotk_resource_info{ready="False", suspended!="true"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready for 15m"

        - alert: CNPGClusterDown
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cluster {{ $labels.cluster }} exporter reports down"

        - alert: CertificateExpiringSoon
          expr: >-
            certmanager_certificate_expiration_timestamp_seconds - time()
            < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }} expires in under 14 days"

        # Guards the whole textfile-collector pattern (wireguard, disk
        # usage, nixos revisions): an unreadable or malformed .prom file
        # silently drops every metric in it — this alert would have caught
        # the #127 mktemp-0600 bug the moment it rolled out.
        - alert: TextfileCollectorBroken
          expr: node_textfile_scrape_error == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: node_exporter textfile collector failing — a .prom file is unreadable or malformed"

        # sfi-nixos-rollback (nixos/modules/ops/nixos-rollback.nix) pins
        # the pull loop to a prior generation; the metric IS the pin. A
        # hold is deliberate for hours, not days — a forgotten one is the
        # 2026-09-03 drift incident again (a host quietly off main), so
        # this nags until `sudo sfi-nixos-rebuild` lifts it.
        - alert: NixosGenerationPinned
          expr: node_nixos_pinned_generation_info == 1
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} pinned to NixOS generation {{ $labels.generation }} for >6h (sfi-nixos-rollback) — main is not being applied; sudo sfi-nixos-rebuild lifts it"

    # Mesh health (#121): metrics come from the wireguard-metrics timer on
    # each host (nixos/modules/wireguard.nix) via the node_exporter
    # textfile collector. Edge-local on purpose — a dead tunnel must page
    # from whichever side still has a path out. Keepalive-gated so roaming
    # clients (laptops, phones) going quiet never page; mesh peers all
    # carry persistentKeepalive and handshake at least every ~2-3min, so
    # >300s is drift/death, not jitter. The 2026-09-03 incident (luxor's
    # stale peer set silently killing the production-test tunnel) would
    # have fired this from production-test's side within minutes.
    - name: mesh-health
      rules:
        - alert: WireGuardPeerSilent
          expr: >-
            (time() - node_wireguard_latest_handshake_seconds > 300)
            and on (instance, peer) node_wireguard_peer_keepalive_seconds > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }}: no WireGuard handshake from mesh peer {{ $labels.peer }} in >5m"

        # A frozen textfile means the collector timer died, not the mesh —
        # without this, WireGuardPeerSilent would keep evaluating stale
        # handshake ages and eventually fire with fiction.
        - alert: WireGuardMetricsStale
          expr: time() - node_textfile_mtime_seconds{file="wireguard.prom"} > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: wireguard.prom not updated for >15m — wireguard-metrics timer dead"

    # Backup freshness (#323). Two silent failures found on 2026-09-17: an
    # offsite leg refused by B2 (account caps, a wrong key) while the
    # local leg stays green, and a writer that quietly stops under the
    # db buckets' 90 d age-based expiry, which cannot tell a dead fort's
    # lineage from a broken job — only freshness can. Every rule here reads
    # a metric a unit already publishes; none reaches B2 (the ground-truth
    # listing is #323's second half).
    - name: backups
      rules:
        # restic PV backups: one series per destination (target=rustfs|b2)
        # from the textfile the unit writes on success. Joined to the path
        # count so "nothing to back up yet" (paths=0, the unit skips and
        # writes no timestamp) is not "backups are broken". The threshold
        # is the unit's own: node_pv_backup_max_age_seconds, published next
        # to the path count, is 2× that target's cadence (36 h for the
        # 6-hourly targets, 8 d for the production profile's weekly rustfs
        # copy — a flat 36 h fired on every production fort from Monday
        # to Sunday, 2026-09-21). A host not yet rebuilt with the metric
        # falls back to 36 h rather than going silent.
        - alert: PVBackupStale
          expr: >-
            (time() - node_pv_backup_last_success_seconds)
              > on (instance, target)
                (node_pv_backup_max_age_seconds or on (instance, target) (node_pv_backup_paths * 0 + 36 * 3600))
              and on (instance, target) node_pv_backup_paths > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: no successful restic backup to {{ $labels.target }} within its max age ({{ $value | humanizeDuration }} since the last)"

        # Paths to back up, and no success EVER for that destination: the
        # unit is failing from the start (a bad key, a capped account, a
        # missing bucket). 12 h covers a fresh fort's first scheduled run.
        - alert: PVBackupNeverSucceeded
          expr: >-
            node_pv_backup_paths > 0
              unless on (instance, target) node_pv_backup_last_success_seconds
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: restic target {{ $labels.target }} has paths to back up and has never succeeded"

        # CNPG base backups through the barman-cloud plugin, which
        # publishes its own timestamps (the in-tree
        # cnpg_collector_last_available_backup_timestamp does NOT see
        # plugin backups). A cluster with no backup yet reports 0, i.e. an
        # age of "now": right for a cluster that should have one, so the
        # `for` is what lets a fresh cutover take its first base backup.
        - alert: CNPGBaseBackupStale
          expr: (time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 36 * 3600
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.cluster }}: no successful base backup in >36h (plugin)"

        - alert: CNPGBackupFailed
          expr: >-
            barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp
              > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.cluster }}: the latest base backup attempt failed"

        # WAL archiving, scoped to clusters that archive somewhere (the
        # plugin series exists): a lab cluster's archiver has nowhere to
        # go and must not page. CNPG switches a segment at least every
        # archive_timeout (5 m default), so an hour without one is stuck.
        # Known false positive: postgres only forces the timed switch if
        # WAL was written since the last one, so a cluster nobody writes
        # to (the drill fort's sites-db after gitea left it, 2026-09-21)
        # trips this too. On a production fort an hour of silence is
        # itself worth a look; on a fort being dismantled it goes with
        # the fort.
        - alert: CNPGWALArchivingStale
          expr: >-
            cnpg_pg_stat_archiver_seconds_since_last_archival > 3600
              and on (namespace, job) barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.cluster }}: no WAL segment archived in >1h — PITR window is not advancing"

        - alert: CNPGWALArchiveFailing
          expr: >-
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
              and on (namespace, job) barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.cluster }}: WAL archive_command failing (last failure newer than last success)"

        # The pruner's freshness (sfi.pv-prune, luxor only): one series per
        # tier, written after a sweep with no failed repo. Weekly plus
        # jitter, so 8 d — a missed sweep is a bill on B2 and a filling
        # disk on luxor, and a repo whose lock outlasts the retry fails
        # the whole sweep's metric on purpose. No series = never run: a
        # host that enables the module sees this within a week.
        - alert: PVPruneStale
          expr: (time() - node_pv_prune_last_success_seconds) > 8 * 86400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}: no clean restic prune sweep on the {{ $labels.tier }} tier in >8d — every repo there is only growing"
