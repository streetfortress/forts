# The fort's providers, one directory each under the one namespace
# (namespace.yaml). `fort add` renders a provider directory on the fort's
# first need of its type and appends it here; a tenant registration
# after that edits the provider directory, not this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres
  - rustfs
