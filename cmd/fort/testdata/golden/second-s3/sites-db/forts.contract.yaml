# Provider contract (docs/fort-configuration-contracts.md) — NON-SECRET, rendered from the
# fort CLI's sites-db template (there is no chart of ours to carry it);
# `fort seed` executes it. Each tenant registration appends its
# secrets-<app>.sops.yaml entry at the end.
secrets:
  secrets-gallery.sops.yaml:
    metadata:
      name: sites-db-gallery-credentials
      namespace: sites-db
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: gallery}
      # gallery's role password; the app env mirrors it (lockstep pair).
      password: {generate: hex24}
