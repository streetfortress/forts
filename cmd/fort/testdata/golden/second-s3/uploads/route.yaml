# HTTPRoute for uploads, as `fort add` renders it from the chart
# contract's http block (uploads:8080) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-uploads.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uploads
  namespace: uploads
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https-uploads
  hostnames:
    - uploads.lab-fort.lofi
  rules:
    - backendRefs:
        - name: uploads
          port: 8080
