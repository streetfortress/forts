# https listener for gallery — appended to the Gateway by the patch
# entry in kustomization.yaml. Hostname follows the lab convention
# <app>.<fort>.deployments.mesh (the estate's mesh zone); the certificate is certificate-gallery.yaml.
- op: add
  path: /spec/listeners/-
  value:
    name: https-gallery
    port: 8443
    protocol: HTTPS
    hostname: gallery.lab-fort.deployments.mesh
    tls:
      mode: Terminate
      certificateRefs:
        - name: gallery-tls
    allowedRoutes:
      namespaces:
        from: All
