# https listener for uploads — appended to the Gateway by the patch
# entry in kustomization.yaml. Hostname follows the lab convention
# <app>.<fort>.deployments.mesh (the estate's mesh zone); the certificate is certificate-uploads.yaml.
- op: add
  path: /spec/listeners/-
  value:
    name: https-uploads
    port: 8443
    protocol: HTTPS
    hostname: uploads.lab-fort.deployments.mesh
    tls:
      mode: Terminate
      certificateRefs:
        - name: uploads-tls
    allowedRoutes:
      namespaces:
        from: All
