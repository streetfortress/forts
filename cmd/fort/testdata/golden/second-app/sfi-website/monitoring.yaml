# Scrape wiring for sfi-website's ui metrics, as `fort add` renders it
# from the chart contract's metrics block (port `metrics`, component
# ui). Scraped by the edge Prometheus (podMonitorSelector {}),
# remote-written to the hub like everything else. Alert rules are
# fort-side policy, not chart facts — add them by hand when this fort's
# sfi-website should page.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sfi-website-ui
  namespace: sfi-website
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sfi-website
      app.kubernetes.io/component: ui
  podMetricsEndpoints:
    - port: metrics
