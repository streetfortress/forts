apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer-step-ca.yaml
  - gateway.yaml
  - redirect-https.yaml
  - certificate-sfi-website.yaml
# One JSON6902 patch per service appends its https listener to the
# Gateway (the design's one exception to "new files only": listeners
# live in a single object, and a strategic-merge patch cannot append to
# a CRD list — kustomize has no merge key for it). fort add adds a file
# here and one entry below; gateway.yaml is never edited.
patches:
  - path: listener-sfi-website.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: homelab
      namespace: traefik
