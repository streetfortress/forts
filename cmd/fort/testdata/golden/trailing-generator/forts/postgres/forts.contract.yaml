# Provider contract (docs/fort-configuration-contracts.md) — NON-SECRET, rendered from the
# fort CLI's postgres template (there is no chart of ours to carry it);
# `fort seed` executes it. Each tenant registration appends its
# secrets-<app>.sops.yaml entry at the end.
secrets:
  secrets-umami.sops.yaml:
    metadata:
      name: postgres-umami-credentials
      namespace: forts
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: umami}
      # umami's role password; the app env mirrors it (lockstep pair).
      password: {generate: hex24}
  secrets-sfi-website.sops.yaml:
    metadata:
      name: postgres-sfi-website-credentials
      namespace: forts
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: sfi-website}
      # sfi-website's role password; the app env mirrors it (lockstep pair).
      password: {generate: hex24}
