# sfi-website's login role on the fort's postgres — appended to
# managed.roles by the patch entry in kustomization.yaml; the password
# is postgres-sfi-website-credentials (secrets-sfi-website.sops.yaml).
- op: add
  path: /spec/managed/roles/-
  value:
    name: sfi-website
    ensure: present
    login: true
    passwordSecret:
      name: postgres-sfi-website-credentials
