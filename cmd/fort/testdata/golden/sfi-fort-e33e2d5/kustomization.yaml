apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # sops-canary.yaml is generated by cluster-init during provisioning
  # (encrypted to the cluster's fresh age key); listing it missing keeps
  # `kustomize build` failing until identity exists — the established
  # pre-merge guard.
  - sops-canary.yaml
  # Born as the CNPG backup/restore drill fort (#158 phases 1-3, sites-db
  # only); since 2026-09-13 it is the fort CLI's rehearsal fort (#144):
  # the tree below is what `fort add` is specified to render
  # (docs/fort-configuration-contracts.md, worked example), laid down by hand first so the
  # generator has a golden tree to reproduce.
  - sites-db
  - gateway
  - valkey
  - symbology
