# One shared namespace for the sites' database cluster. Unlike symbology
# (app + DB co-located in one namespace), sfi-website and dial-in share a
# single CNPG cluster that neither app owns, so it gets its own namespace
# and the apps reach it cross-namespace via the -rw Service.
apiVersion: v1
kind: Namespace
metadata:
  name: sites-db
  # forts.sfi/provider: the one label every provider namespace a fort runs
  # carries — `fort check` requires it; `kubectl get ns -l forts.sfi/provider`
  # enumerates the set (#326).
  labels:
    forts.sfi/provider: postgres
