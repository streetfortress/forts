# HTTPRoute for symbology, as `fort add` renders it from the chart
# contract's http block (symbology-ui:3000) and the fort's hostname
# convention; attaches to the listener added by
# ../gateway/listener-symbology.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: symbology
  namespace: symbology
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
      sectionName: https-symbology
  hostnames:
    - symbology.sfi-fort-e33e2d5.deployments.mesh
  rules:
    - backendRefs:
        - name: symbology-ui
          port: 3000
