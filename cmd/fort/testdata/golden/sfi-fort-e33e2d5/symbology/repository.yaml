# Symbology's chart as a single-chart OCI artifact (OCIRepository +
# HelmRelease.chartRef, ref.tag pinned = chart version). This fort ran
# sfi/symbology#189's per-commit preview charts (a semver filter on
# 0.0.0-pr.189.*) until the PR merged and its previews were cleaned from
# the registry (2026-09-14: FetchFailed, the stored artifact kept
# serving); now a plain tag like every other fort — the chart has shipped
# the contract since 0.1.7. Renovate's flux manager tracks ref.tag.
#
# certSecretRef: source-controller pods do NOT inherit the node's step-ca
# trust (unlike containerd image pulls), so the registry's CA is provided
# explicitly, generated from the local step-ca-root.pem copy by this
# app's kustomization.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: symbology
  namespace: flux-system
spec:
  interval: 1h
  url: oci://gitea.zen.lofi/sfi/symbology
  ref:
    tag: "0.1.9"
  certSecretRef:
    name: symbology-oci-ca
