# Seeding contract — NON-SECRET; `fort seed` executes it.
#
# PRE-`fort seed` FULL FORM. The chart's own forts.contract.yaml
# (sfi/symbology#189, inside the 0.0.0-pr.189.* tarballs this fort runs)
# is the contract; this file is what the current python seeder needs to
# produce the same Secret, and it shrinks to nothing once the CLI reads
# the chart's copy (docs/fort-configuration-contracts.md). Key set = the chart contract's
# `secret.keys`, plus ADMIN_EMAILS (kept secret-borne on purpose: a
# personal address — the gate warns on an extra key, never fails).
#
# External keys are copied from staging-k3s's symbology Secret (test-mode
# Stripe keys, staging's Resend/Anthropic keys): the drill fort is a lab
# VM behind the mesh, so staging's credentials are the right tier.
# Cross-cluster sops refs are fine — the admin key decrypts the source,
# the output encrypts to THIS fort's recipients.
vars:
  # requires.postgres.db → the sites-db tenant role (lockstep pair).
  db_password: {sops: [../sites-db/secrets-symbology.sops.yaml, stringData.password]}
  # requires.valkey.cache → the valkey-users ACL entry (lockstep pair).
  cache_password: {sops: [../valkey/secrets.sops.yaml, stringData.symbology]}
secrets:
  secrets.sops.yaml:
    metadata:
      name: symbology-env
      namespace: symbology
    keys:
      # As the chart contract declares it (the seeded value predates the
      # seeder's b64_N support and is hex; a rotation yields b64).
      BETTER_AUTH_SECRET: {generate: b64_32}
      DATABASE_PASSWORD: {template: "${db_password}"}
      CACHE_PASSWORD: {template: "${cache_password}"}
      STRIPE_SECRET_KEY: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.STRIPE_SECRET_KEY]}
      STRIPE_WEBHOOK_SECRET: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.STRIPE_WEBHOOK_SECRET]}
      RESEND_API_KEY: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.RESEND_API_KEY]}
      OPENAI_API_KEY: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.OPENAI_API_KEY]}
      ANTHROPIC_API_KEY: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.ANTHROPIC_API_KEY]}
      ADMIN_EMAILS: {sops: [../../staging-k3s/symbology/secrets.sops.yaml, stringData.ADMIN_EMAILS]}
