# Scrape wiring for symbology's worker metrics, as `fort add` renders it
# from the chart contract's metrics block (port `metrics`, component
# worker). Scraped by the edge Prometheus (podMonitorSelector {}),
# remote-written centrally like everything else. Alert rules are
# fort-side policy, not chart facts — add them by hand (staging-k3s's
# monitoring.yaml has the set) when this fort's symbology should page.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: symbology-worker
  namespace: symbology
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: symbology
      app.kubernetes.io/component: worker
  podMetricsEndpoints:
    - port: metrics
