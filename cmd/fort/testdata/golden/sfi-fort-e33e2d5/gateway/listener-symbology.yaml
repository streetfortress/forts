# https listener for symbology — appended to the Gateway by the patch
# entry in kustomization.yaml. Hostname follows the lab convention
# <app>.<fort>.deployments.mesh (the estate's mesh zone); the certificate is certificate-symbology.yaml.
- op: add
  path: /spec/listeners/-
  value:
    name: https-symbology
    port: 8443
    protocol: HTTPS
    hostname: symbology.sfi-fort-e33e2d5.deployments.mesh
    tls:
      mode: Terminate
      certificateRefs:
        - name: symbology-tls
    allowedRoutes:
      namespaces:
        from: All
