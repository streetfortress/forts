# Serving cert for the https-symbology listener; issued by step-ca via the
# ACME http01 gateway solver (challenge routes attach to the http listener).
# Requires symbology.sfi-fort-e33e2d5.lofi to resolve to this node in lab
# DNS (dnsmasq on 10.0.0.2) — the ACME server dials the hostname back.
# Until it does, cert-manager retries harmlessly and the listener serves
# its self-signed placeholder.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: symbology
  namespace: traefik
spec:
  secretName: symbology-tls
  dnsNames:
    - symbology.sfi-fort-e33e2d5.lofi
  issuerRef:
    kind: ClusterIssuer
    name: step-ca
