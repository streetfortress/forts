# The staging-seed consumer: staging-k3s's sites-db shape (deployer +
# symbology roles, four logical databases) on a disposable fort, now
# bootstrapped EMPTY and loaded from the promoted seed on rustfs-central
# (seed-restore-job.yaml) instead of importing live from db2 — the last
# thing that tied a lab fort to a host being decommissioned (#340).
#
# History: this cluster was the physical backup/restore drill (#158):
# imported from db2, archived to luxor's rustfs, repaved and recovered in
# minutes. That is proven and its lineage on luxor's `cnpg` bucket ages
# out in 7 d; there is no backup block any more (a lab fort's data is
# derived — docs/infra/backups.md, "Seeds are not backups").
#
# initdb only runs at cluster CREATION: applying this to the existing
# cluster changes nothing. Delete the Cluster and its PVC (admin
# kubeconfig; the fort is disposable) and flux recreates it from here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: forts
spec:
  instances: 1

  # Small-SKU probe tolerance, proven on staging (#161).
  livenessProbeTimeout: 10
  imageName: gitea.zen.lofi/sfi/postgresql:18.4-5997d52

  bootstrap:
    initdb:
      database: symbology
      owner: symbology
      secret:
        name: postgres-symbology-credentials

  # The seed is restored by the superuser: the dump carries extensions
  # (CREATE EXTENSION is superuser-only for the untrusted ones) and
  # --no-owner hands everything to the connecting role, which the Job
  # then re-attributes with --role=symbology. This is a lab fort.
  enableSuperuserAccess: true

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: deployer
        ensure: present
        login: true
        passwordSecret:
          name: postgres-deployer-credentials
      - name: symbology
        ensure: present
        login: true
        passwordSecret:
          name: postgres-symbology-credentials

  storage:
    size: 40Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
