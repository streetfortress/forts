# Load the promoted symbology seed into this cluster (seed-restore.sh).
# SUSPENDED: flip `suspend` to false once the cluster has been (re)created
# from cluster.yaml's empty initdb; bump seed.sfi/run to run again after a
# failure (a lab fort that half-loaded repaves rather than being loaded
# twice — the script refuses a non-empty database).
#
#   fetch    rclone     sfi-seeds-reader   latest.dump + latest.json → emptyDir
#   restore  postgres   the superuser      checksum, extensions, pg_restore
#
# The dump is ~5 GB; the emptyDir is on the node's disk.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-restore
  namespace: forts
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  suspend: false
  backoffLimit: 0
  template:
    metadata:
      annotations:
        seed.sfi/run: "1"
    spec:
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {}
        - name: scripts
          configMap:
            name: seed-restore-scripts
            defaultMode: 0555
      initContainers:
        - name: fetch
          image: rclone/rclone:1.75.1
          env:
            - name: RCLONE_CONFIG_R_TYPE
              value: s3
            - name: RCLONE_CONFIG_R_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_R_ENV_AUTH
              value: "true"
            - name: RCLONE_CONFIG_R_ENDPOINT
              value: http://10.1.0.5:30901
            - name: RCLONE_CONFIG_R_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_S3_NO_CHECK_BUCKET
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: postgres-seed-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: postgres-seed-credentials, key: AWS_SECRET_ACCESS_KEY}}
          volumeMounts:
            - {name: work, mountPath: /work}
          command:
            - /bin/sh
            - -ec
            - |
              echo "== what the seeds bucket holds"
              rclone lsl r:sfi-seeds/symbology 2>/dev/null
              rclone copyto r:sfi-seeds/symbology/latest.json /work/latest.json
              rclone copyto r:sfi-seeds/symbology/latest.dump /work/latest.dump
              ls -l /work
      containers:
        - name: restore
          image: gitea.zen.lofi/sfi/postgresql:18.4-5997d52
          env:
            - name: PGHOST
              value: postgres-rw
            - name: PGDATABASE
              value: symbology
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: password}}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: scripts, mountPath: /scripts}
          command: ["/scripts/seed-restore.sh"]
