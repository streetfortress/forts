# DATABASE_URLs reference it verbatim.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dial-in
  namespace: forts
spec:
  name: dial-in
  owner: deployer
  cluster:
    name: postgres
