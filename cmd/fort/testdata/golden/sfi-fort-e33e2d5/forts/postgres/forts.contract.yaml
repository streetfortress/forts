# Machine-readable seeding contract (#144) — NON-SECRET: describes where
# each key's value comes from; `fort seed` executes it.
# Cross-app sops refs reach into other clusters' app dirs — fine: the
# admin key decrypts any of them, and outputs encrypt to THIS cluster's
# recipients (rules added at cluster-init).
vars:
  # The shared reader identity on luxor's rustfs-central (its contract
  # generates it): list + get on sfi-seeds. The key NAME is the access key.
  seed_reader_secret: {sops: [../../luxor/rustfs-central/users.sops.yaml, stringData.sfi-seeds-reader]}
secrets:
  secrets-db.sops.yaml:
    metadata:
      name: postgres-deployer-credentials
      namespace: forts
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: deployer}
      password: {generate: hex24}
  secrets-symbology.sops.yaml:
    metadata:
      name: postgres-symbology-credentials
      namespace: forts
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: symbology}
      # Fresh, deliberately NOT staging's value: no app points here, and
      # the drill should prove restore works without inherited state.
      password: {generate: hex24}
  secrets-seed.sops.yaml:
    metadata:
      name: postgres-seed-credentials
      namespace: forts
    keys:
      # seed-restore-job.yaml's fetch half. The SDK's variable names.
      AWS_ACCESS_KEY_ID: {literal: sfi-seeds-reader}
      AWS_SECRET_ACCESS_KEY: {template: "${seed_reader_secret}"}
