# Provider contract (docs/fort-configuration-contracts.md) — NON-SECRET, rendered from the
# fort CLI's valkey template (there is no chart of ours to carry it);
# `fort seed` executes it.
# Key name = ACL username (the chart's usersExistingSecret convention).
# Each tenant registration appends its key here; symbology-env's
# CACHE_PASSWORD is sourced from this file — lockstep pair on rotation.
secrets:
  secrets.sops.yaml:
    metadata:
      name: valkey-users
      namespace: forts
    keys:
      default: {generate: hex24}
      symbology: {generate: hex24}
