# Serving cert for the https-gallery listener; issued by the estate's
# ClusterIssuer `letsencrypt` (https://acme-v02.api.letsencrypt.org/directory) via the ACME http01
# gateway solver. Gated on DNS: until gallery.lab-fort.deployments.mesh resolves to this
# fort where the ACME server looks, cert-manager retries harmlessly and
# the listener serves its self-signed placeholder.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gallery
  namespace: traefik
spec:
  secretName: gallery-tls
  dnsNames:
    - gallery.lab-fort.deployments.mesh
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
