apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  # sfi-website-env, seeded by `fort seed` from forts.inventory.yaml.
  # Listed-but-absent = the pre-merge kustomize guard.
  - secrets.sops.yaml
  - route.yaml
  - monitoring.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Local copy of nixos/certs/ca-root.pem (kustomize build-root
  # restriction); consumed as certSecretRef by the OCIRepository so
  # source-controller trusts the estate's registry. Public cert, plain
  # generator — no sops.
  - name: sfi-website-oci-ca
    namespace: flux-system
    files:
      - ca.crt=ca-root.pem
