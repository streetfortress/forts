# Serving cert for the https-sfi-website listener; issued by Let's Encrypt
# via the ACME http01 gateway solver. Gated on DNS: until sfi-website.cloud-fort.example.cloud
# points at this fort, cert-manager retries harmlessly and the listener
# serves its self-signed placeholder.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sfi-website
  namespace: traefik
spec:
  secretName: sfi-website-tls
  dnsNames:
    - sfi-website.cloud-fort.example.cloud
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
