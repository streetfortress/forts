# Provider contract (docs/fort-configuration-contracts.md) — NON-SECRET, rendered from the
# fort CLI's postgres template (there is no chart of ours to carry it);
# `fort seed` executes it. Each tenant registration appends its
# secrets-<app>.sops.yaml entry at the end.
secrets:
  secrets-backup.sops.yaml:
    metadata:
      name: postgres-backup-credentials
      namespace: forts
    keys:
      # The fort's OWN B2 key for the physical bucket — sfi-db-physical-
      # cloud-fort, minted by `fort b2-key db-physical cloud-fort
      # --write` and set with `fort seed cloud-fort postgres --set
      # <KEY> --write`. Held here, in the cluster, beside postgres, and
      # in no host's nixos secrets (docs/infra/backups.md, "One key per
      # host per bucket").
      ACCESS_KEY_ID: {external: "sfi-db-physical-cloud-fort key id (fort b2-key db-physical cloud-fort --write)"}
      ACCESS_SECRET_KEY: {external: "sfi-db-physical-cloud-fort application key (the same mint)"}
      # Not a secret; the ObjectStore CRD only takes it from a Secret.
      REGION: {literal: us-west-004}
  secrets-sfi-website.sops.yaml:
    metadata:
      name: postgres-sfi-website-credentials
      namespace: forts
      type: kubernetes.io/basic-auth
    keys:
      username: {literal: sfi-website}
      # sfi-website's role password; the app env mirrors it (lockstep pair).
      password: {generate: hex24}
