# Nightly base backup (WAL streams continuously regardless), through the
# barman-cloud plugin — objectstore.yaml is the destination. immediate:
# fires on object CREATION — the object NAME is the retrigger knob
# (rename => flux delete+create => immediate re-fires; drill-fort
# lesson: a ScheduledBackup edited in place archived WAL for an hour
# with no base backup to belong to). The hour is the manifest's
# ([backups.db-physical] hour, #284): forts stagger it there, so no two
# archives upload at once.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly
  namespace: forts
spec:
  # Six-field cron (CNPG uses seconds): 04:00 UTC daily.
  schedule: "0 0 4 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: postgres
