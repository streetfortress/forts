# Serving cert for the https-gallery listener; issued by step-ca via the
# ACME http01 gateway solver (challenge routes attach to the http listener).
# Every host on the mesh resolves gallery.lab-fort.deployments.mesh to this fort already
# (the zone, sfi/forts modules/mesh-dns.nix); the ACME server dials the
# hostname back, so it must resolve where step-ca runs too — the LAN
# resolver, by hand, until the CA is a hub role on the mesh (forts#46).
# Until it does, cert-manager retries harmlessly and the listener serves
# its self-signed placeholder.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gallery
  namespace: traefik
spec:
  secretName: gallery-tls
  dnsNames:
    - gallery.lab-fort.deployments.mesh
  issuerRef:
    kind: ClusterIssuer
    name: step-ca
