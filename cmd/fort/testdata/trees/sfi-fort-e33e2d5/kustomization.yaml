apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # sops-canary.yaml is generated by fort mint during provisioning
  # (encrypted to the cluster's fresh age key); listing it missing keeps
  # `kustomize build` failing until identity exists — the established
  # pre-merge guard.
  - sops-canary.yaml
  # Deliberately lean: no gateway, no sites, no symbology app. This fort
  # exists to drill the CNPG backup/restore cycle on the monolith shape;
  # workloads would only blur the timings.
  - forts
