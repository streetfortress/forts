# umami's login role on the fort's postgres — appended to
# managed.roles by the patch entry in kustomization.yaml; the password
# is postgres-umami-credentials (secrets-umami.sops.yaml).
- op: add
  path: /spec/managed/roles/-
  value:
    name: umami
    ensure: present
    login: true
    passwordSecret:
      name: postgres-umami-credentials
