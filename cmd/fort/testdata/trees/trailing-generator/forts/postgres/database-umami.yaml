# umami's database on the fort's postgres — tenant registration
# by `fort add` (requires.postgres.db): this CR keeps
# owner + extensions reconciled; the role rides role-umami.yaml and
# its password secrets-umami.sops.yaml (mirrored into the app's env —
# lockstep pair on rotation).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: umami
  namespace: forts
spec:
  name: umami
  owner: umami
  cluster:
    name: postgres
