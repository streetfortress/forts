# sfi-fort-e33e2d5 — the fort CLI's test environment, on the lab hypervisor.
#
# Created as the CNPG backup-drill fort (generated-name convention): seed the
# sites-db monolith from db2, barman-archive to luxor's rustfs (mesh NodePort
# 30900), re-provision, restore via bootstrap.recovery — proving a re-provision
# rides the physical path. Same SKU as staging so the restore-vs-import timing
# is honest. Disposable by design. Adopted under the libvirt backend 2026-09-14
# (fort adopt: imported, no re-provision) — the first of the playbook-era VMs
# to move.
mesh_ip = "10.1.0.15"

[cluster]
datastore = "sqlite"

[backups]
profile = "lab"   # luxor's rustfs only — reproducible, and not an original

[shape]
vcpus = 2
memory = 4
disk = "80G"

[libvirt]
ip = "10.0.0.41"
